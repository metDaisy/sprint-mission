spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

discodeit:
  storage:
    type: ${STORAGE_TYPE}
    local:
      root-path: ${LOCAL_STORAGE_ROOT_PATH}
aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
  region: ${AWS_REGION}
