spring:
  datasource:
    url: jdbc:h2:mem:demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: warn
    com.sprint.mission.discodeit: debug
    org.hibernate:
      SQL: debug
      type.descriptor.sql.BasicBinder: trace
