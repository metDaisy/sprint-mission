discodeit:
  storage:
    type: local # local or db
    local:
      root-path: /binary-contents

springdoc:
  swagger-ui:
    url: /api/api-docs_1.1.json

spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  datasource:
    url: jdbc:postgresql://localhost:5433/discodeit
    username: discodeit_user
    password: discodeit1234

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database: PostgreSQL
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
            extract: trace
