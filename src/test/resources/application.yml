spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  datasource:
    url: jdbc:h2:mem:demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    root: warn
    com.sprint.mission.discodeit: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate:
      SQL: debug
      type.descriptor.sql.BasicBinder: trace
